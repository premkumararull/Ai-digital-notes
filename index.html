<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOTES</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>DIGITAL NOTES</h1>

<input type="file" id="imgInput" accept="image/*" capture="environment">
<div id="preview"></div>
<button id="scanBtn">SCAN</button>
<p id="status"></p>

<textarea id="output" rows="8" placeholder="EXTRACTED TEXT"></textarea>

<div class="row">
<button id="saveBtn">SAVE</button>
<button id="exportBtn">EXPORT .DOCX</button>
</div>

<h2>SAVED</h2>
<ul id="notesList"></ul>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.js"></script>
<script src="app.js"></script>
</body>
</html>
